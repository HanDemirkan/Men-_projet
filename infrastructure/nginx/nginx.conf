worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Don't leak the nginx version in the Server header / error pages.
  server_tokens off;

  # Uploads aren't implemented yet (see packages/storage), but the API's
  # STORAGE_MAX_FILE_SIZE_MB default is 10MB - keep this in sync with that
  # value plus headroom for multipart overhead.
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Optional: Ubuntu ships a Brotli module as a separate package
  # (`apt install libnginx-mod-http-brotli`). Once installed, uncomment:
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types application/javascript application/json text/css text/plain;

  upstream api_upstream {
    server 127.0.0.1:4000;
  }

  upstream web_upstream {
    server 127.0.0.1:3000;
  }

  server {
    listen 80;
    server_name _;

    # CSP is intentionally left to the applications themselves (Helmet in the
    # API); a blanket CSP here would be wrong for the Next.js app once it
    # grows beyond a static dashboard.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    # Serves files written by packages/storage's LocalStorageAdapter once an
    # upload endpoint exists. STORAGE_DIR itself lives outside the repo/app
    # directory (see .env.production.example); point this alias at the same
    # path. Inactive until STORAGE_DIR/public actually contains files.
    location /uploads/ {
      alias /var/lib/qr-platform/storage/public/;
      add_header X-Content-Type-Options nosniff always;
      autoindex off;
      try_files $uri =404;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      # Support Next.js dev-mode websocket (HMR) and any future websocket usage.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
